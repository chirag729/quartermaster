id: codex-cli
name: Codex CLI
description: Confine Codex CLI to project workspace and configuration
task_id: codex-cli
profile_name: quartermaster.codex-cli
mode: complain

variables:
  - key: projects_path
    label: Projects Directory
    type: path
    default: "~/Development/Projects"

content: |
  abi <abi/4.0>,
  include <tunables/global>

  profile codex-cli {{home}}/.nvm/versions/node/*/bin/codex flags=({{mode}}) {
    include <abstractions/base>
    include <abstractions/nameservice>
    include <abstractions/ssl_certs>
    include <abstractions/user-tmp>

    # ── Shell environment (bash init, nvm, Cargo/Rust, user bins) ────
    owner {{home}}/.bashrc r,
    owner {{home}}/.bash_aliases r,
    owner {{home}}/.bash_history rw,
    owner {{home}}/.inputrc r,
    owner {{home}}/.profile r,
    owner {{home}}/.nvm/** rixm,
    owner {{home}}/.cargo/env r,
    owner {{home}}/.cargo/bin/* rixm,
    owner {{home}}/.rustup/ r,
    owner {{home}}/.rustup/** rwklix,
    owner {{home}}/.local/bin/* rix,

    # ── Codex config/data ────────────────────────────────────────────
    owner {{home}}/.codex/ rw,
    owner {{home}}/.codex/** rwk,
    owner {{home}}/.config/codex/ rw,
    owner {{home}}/.config/codex/** rwk,

    # ── Git client (config, SSH read-only) ───────────────────────────
    owner {{home}}/.gitconfig r,
    owner {{home}}/.gitignore r,
    owner {{home}}/.config/git/** r,
    owner {{home}}/.ssh/ r,
    owner {{home}}/.ssh/config r,
    owner {{home}}/.ssh/known_hosts* r,
    owner {{home}}/.ssh/*.pub r,

    # ── System binaries ──────────────────────────────────────────────
    /bin/* rixm,
    /usr/bin/{[^s]*,?[^n]*,??[^a]*,???[^p]*} rixm,
    /usr/local/bin/** rixm,
    /usr/lib/ r,
    /usr/lib/** rixm,
    /usr/lib64/ r,
    /usr/lib64/** rixm,
    /usr/libexec/** rixm,
    /usr/share/** r,

    # ── Git core ─────────────────────────────────────────────────────
    /usr/lib/git-core/** rix,

    # ── Project workspace ────────────────────────────────────────────
    owner {{home}}/Development/ r,
    owner {{projects_path}}/ r,
    owner {{projects_path}}/** rwkl,

    # ── Network (API calls) ──────────────────────────────────────────
    network inet stream,
    network inet6 stream,

    # ── Proc filesystem ──────────────────────────────────────────────
    @{PROC}/@{pid}/** r,

    # ── Deny sensitive areas ─────────────────────────────────────────
    deny {{home}}/.ssh/id_* r,
    deny {{home}}/.gnupg/** rwx,
    deny /etc/shadow r,
  }
