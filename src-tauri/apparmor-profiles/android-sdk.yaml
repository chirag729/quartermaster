id: android-sdk
name: Android SDK
description: Confine Android SDK tools and build processes
task_id: android-sdk
profile_name: quartermaster.android-sdk
mode: complain

variables:
  - key: projects_path
    label: Projects Directory
    type: path
    default: "~/Development/Projects"

content: |
  abi <abi/4.0>,
  include <tunables/global>

  profile android-sdk {{sdk_base_path}}/android/cmdline-tools/latest/bin/* flags=({{mode}}) {
    include <abstractions/base>
    include <abstractions/nameservice>
    include <abstractions/ssl_certs>

    # ── Shell environment (bash init, nvm, Cargo/Rust, user bins) ────
    owner {{home}}/.bashrc r,
    owner {{home}}/.bash_aliases r,
    owner {{home}}/.inputrc r,
    owner {{home}}/.profile r,
    owner {{home}}/.local/bin/* rix,

    # ── JDK toolchain (Gradle, Maven, Java) ──────────────────────────
    owner {{home}}/.gradle/ r,
    owner {{home}}/.gradle/** rwklixm,
    owner {{home}}/.m2/ r,
    owner {{home}}/.m2/** rwkl,
    owner {{home}}/.java/ r,
    owner {{home}}/.java/** rwkl,

    # ── Android SDK read + execute ───────────────────────────────────
    owner {{sdk_base_path}}/android/** rmix,
    owner {{sdk_base_path}}/android/ r,

    # ── Android user config and caches ───────────────────────────────
    owner {{home}}/.android/ r,
    owner {{home}}/.android/** rwk,

    # ── Project workspace ────────────────────────────────────────────
    owner {{projects_path}}/ r,
    owner {{projects_path}}/** rwk,

    # ── Networking for SDK downloads and builds ──────────────────────
    network inet stream,
    network inet dgram,
    network inet6 stream,
    network inet6 dgram,

    # ── JVM execution ────────────────────────────────────────────────
    /usr/lib/jvm/** rmix,
    /usr/lib64/jvm/** rmix,

    # ── System binaries ──────────────────────────────────────────────
    /bin/* rixm,
    /usr/bin/{[^s]*,?[^n]*,??[^a]*,???[^p]*} rixm,
    /usr/local/bin/** rixm,
    /usr/lib/ r,
    /usr/lib/** rixm,
    /usr/lib64/ r,
    /usr/lib64/** rixm,
    /usr/libexec/** rixm,
    /usr/share/** r,

    # ── Temp files ───────────────────────────────────────────────────
    /tmp/** rwk,

    # ── Proc filesystem ──────────────────────────────────────────────
    @{PROC}/@{pid}/** r,

    # ── Device access ────────────────────────────────────────────────
    /dev/null rw,
    /dev/urandom r,

    # ── Deny sensitive areas ─────────────────────────────────────────
    deny {{home}}/.ssh/id_* r,
    deny {{home}}/.gnupg/** rwx,
    deny /etc/shadow r,
  }
