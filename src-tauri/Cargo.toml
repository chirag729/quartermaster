[package]
name = "anvil"
version = "0.1.0"
description = "Anvil"
authors = ["you"]
edition = "2021"

[lib]
name = "anvil_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
shellexpand = "3"
dirs = "6"
notify = "7"
hostname = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
russh = "0.46"
russh-keys = "0.46"
tempfile = "3"
