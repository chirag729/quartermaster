id: create-development-folder
name: Development Folder
description: Create ~/Development directory for projects
icon: FolderOpen
category: Folders
privilege: user
target: any

config:
  - key: path
    label: Folder path
    type: path
    default: "~/Development"
    required: true

detect: |
  test -d "{{path}}"

steps:
  - name: Create directory
    progress: 100
    run: |
      mkdir -p "{{path}}"
