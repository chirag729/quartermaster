id: claude-code
name: Claude Code
description: Install Claude Code CLI via npm
icon: Terminal
category: Applications
tags: [ai, cli]
privilege: user
target: any

apparmor:
  profile: claude-code
  abstractions: [shell-environment, git-client, claude-code]

detect: |
  command -v claude >/dev/null 2>&1 || npm list -g @anthropic-ai/claude-code 2>/dev/null | grep -q claude-code

steps:
  - name: Install Claude Code via npm
    progress: 100
    run: |
      npm install -g @anthropic-ai/claude-code

uninstall:
  - name: Uninstall Claude Code via npm
    progress: 100
    run: |
      npm uninstall -g @anthropic-ai/claude-code
