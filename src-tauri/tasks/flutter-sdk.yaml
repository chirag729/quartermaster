id: flutter-sdk
name: Flutter SDK
description: Download and install Flutter SDK
icon: Smartphone
category: SDKs
tags: [mobile, flutter]
privilege: user
target: any
variables: [sdk_folder]

config:
  - key: channel
    label: Flutter Channel
    type: select
    default: stable
    options: [stable, beta, dev]
    required: false
  - key: sdk_base_path
    label: SDK base path
    type: path
    default: "~/.local/share/sdk"
    required: false

detect: |
  test -f {{sdk_base_path}}/flutter/bin/flutter

steps:
  - name: Create SDK directory
    progress: 5
    run: |
      mkdir -p {{sdk_base_path}}

  - name: Clone Flutter repository
    progress: 20
    run: |
      git clone --depth 1 --branch {{channel}} \
        https://github.com/flutter/flutter.git {{sdk_base_path}}/flutter

  - name: Add Flutter to PATH
    progress: 80
    run: |
      FLUTTER_BIN='export PATH="{{sdk_base_path}}/flutter/bin:$PATH"'
      for rc in {{home}}/.bashrc {{home}}/.zshrc; do
        [ -f "$rc" ] || continue
        grep -qF '{{sdk_base_path}}/flutter/bin' "$rc" && continue
        printf '\n# Flutter SDK\n%s\n' "$FLUTTER_BIN" >> "$rc"
      done

  - name: Verify installation
    progress: 100
    run: |
      test -f {{sdk_base_path}}/flutter/bin/flutter

fragments:
  - tags: [sdk, mobile-sdk]
    content: |
      # ── Flutter / Dart SDK ─────────────────────────────────────
      owner {{sdk_base_path}}/ r,
      owner {{sdk_base_path}}/flutter/ r,
      owner {{sdk_base_path}}/flutter/** rixm,
      owner {{home}}/.config/flutter/ r,
      owner {{home}}/.config/flutter/** rwklix,
      owner {{home}}/.dart-tool/ r,
      owner {{home}}/.dart-tool/** rwklix,
      owner {{home}}/.pub-cache/ r,
      owner {{home}}/.pub-cache/** rwk,

uninstall:
  - name: Remove Flutter PATH entries from shell configs
    progress: 30
    run: |
      for rc in {{home}}/.bashrc {{home}}/.zshrc; do
        [ -f "$rc" ] || continue
        sed -i '/^# Flutter SDK$/d' "$rc"
        sed -i '\|{{sdk_base_path}}/flutter/bin|d' "$rc"
      done

  - name: Remove Flutter SDK directory
    progress: 100
    run: |
      rm -rf {{sdk_base_path}}/flutter
