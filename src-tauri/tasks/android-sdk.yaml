id: android-sdk
name: Android SDK
description: Download and install Android command-line tools
icon: Tablet
category: SDKs
tags: [mobile, android]
privilege: user
target: any
variables: [sdk_folder]

config:
  - key: sdk_base_path
    label: SDK base path
    type: path
    default: "~/.local/share/sdk"
    required: false

detect: |
  test -d {{sdk_base_path}}/android/cmdline-tools

steps:
  - name: Download Android command-line tools
    progress: 10
    run: |
      mkdir -p {{sdk_base_path}}/android
      curl -fSL -o {{sdk_base_path}}/android/cmdline-tools.zip \
        https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

  - name: Extract tools
    progress: 60
    run: |
      unzip -q -o {{sdk_base_path}}/android/cmdline-tools.zip \
        -d {{sdk_base_path}}/android
      rm -f {{sdk_base_path}}/android/cmdline-tools.zip

  - name: Reorganize to cmdline-tools/latest structure
    progress: 70
    run: |
      SDK_PATH={{sdk_base_path}}/android
      mv "$SDK_PATH/cmdline-tools" "$SDK_PATH/cmdline-tools-temp"
      mkdir -p "$SDK_PATH/cmdline-tools"
      mv "$SDK_PATH/cmdline-tools-temp" "$SDK_PATH/cmdline-tools/latest"

  - name: Add Android SDK to PATH
    progress: 100
    run: |
      for rc in {{home}}/.bashrc {{home}}/.zshrc; do
        [ -f "$rc" ] || continue
        grep -qF 'ANDROID_HOME' "$rc" && continue
        printf '\n# Android SDK\nexport ANDROID_HOME="{{sdk_base_path}}/android"\nexport PATH="{{sdk_base_path}}/android/cmdline-tools/latest/bin:{{sdk_base_path}}/android/platform-tools:$PATH"\n' >> "$rc"
      done

fragments:
  - tags: [sdk, mobile-sdk]
    content: |
      # ── Android SDK ────────────────────────────────────────────
      owner {{sdk_base_path}}/ r,
      owner {{sdk_base_path}}/android/ r,
      owner {{sdk_base_path}}/android/** rixm,
      owner {{home}}/.android/ r,
      owner {{home}}/.android/** rwk,

uninstall:
  - name: Remove Android SDK PATH and environment entries from shell configs
    progress: 30
    run: |
      for rc in {{home}}/.bashrc {{home}}/.zshrc; do
        [ -f "$rc" ] || continue
        # Remove the comment line, ANDROID_HOME export, and PATH line referencing this SDK
        sed -i '/^# Android SDK$/d' "$rc"
        sed -i '/export ANDROID_HOME=/d' "$rc"
        sed -i '\|{{sdk_base_path}}/android|d' "$rc"
      done

  - name: Remove Android SDK directory
    progress: 100
    run: |
      rm -rf {{sdk_base_path}}/android
