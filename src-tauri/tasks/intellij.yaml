id: intellij-idea
name: IntelliJ IDEA
description: Install IntelliJ IDEA from the Snap Store
icon: Code
category: Applications
tags: [ide, java]
privilege: admin
target: local_only
variables: [dev_folder]

apparmor:
  profile: intellij

detect: |
  snap list intellij-idea 2>/dev/null | grep -q intellij-idea

steps:
  - name: Install IntelliJ IDEA snap
    progress: 90
    run: |
      snap install intellij-idea --classic

  - name: Verify installation
    progress: 100
    run: |
      snap list intellij-idea

uninstall:
  - name: Remove IntelliJ IDEA snap
    progress: 100
    run: |
      snap remove intellij-idea

version_detect: |
  snap list intellij-idea 2>/dev/null | awk '/^intellij-idea / {print $2}'
