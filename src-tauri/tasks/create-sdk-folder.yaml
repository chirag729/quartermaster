id: create-sdk-folder
name: SDK Folder
description: Create SDK directory for SDK installations
icon: FolderOpen
category: Folders
privilege: user
target: any
variables: [sdk_folder]

config:
  - key: path
    label: Folder path
    type: path
    default: "~/.local/share/sdk"
    required: true

detect: |
  test -d "{{path}}"

steps:
  - name: Create directory
    progress: 100
    run: |
      mkdir -p "{{path}}"
